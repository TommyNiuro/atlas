[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas: Personal Operating System. Backend FastAPI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "keyring>=25",
    "cryptography>=43",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pyyaml>=6",
    "msal>=1.37.0",
    "python-dotenv>=1.2.2",
    "anthropic>=0.7",
    "redis>=5",
    "dateparser>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]
