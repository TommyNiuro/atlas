version: "3"

tasks:
  dev:
    desc: Levanta el stack completo (postgres+redis en Docker, api y web nativos)
    deps: [dev:db, dev:api, dev:web]

  dev:db:
    cmds:
      - docker compose -f infra/docker-compose.yml up -d

  dev:api:
    dir: apps/api
    cmds:
      - uv run uvicorn atlas.main:app --reload --port 8000

  dev:web:
    dir: apps/web
    cmds:
      - pnpm dev

  setup:
    desc: Instalacion inicial multiplataforma
    cmds:
      - python3 scripts/setup.py

  test:
    desc: Tests de api y web
    cmds:
      - cd apps/api && uv run pytest
      - cd apps/web && pnpm build

  lint:
    cmds:
      - cd apps/api && uv run ruff check .

  migrate:
    desc: Aplica las migraciones de Alembic
    dir: apps/api
    cmds:
      - uv run alembic upgrade head

  seed:
    desc: Carga las areas de trabajo (idempotente)
    dir: apps/api
    cmds:
      - uv run python -m atlas.db.seed

  auth-outlook:
    desc: Device code flow de Outlook (pega el codigo en el navegador)
    dir: apps/api
    cmds:
      - uv run python -m atlas.connectors.sync outlook_mail --auth

  sync:
    desc: Sync manual de Outlook Mail
    dir: apps/api
    cmds:
      - uv run python -m atlas.connectors.sync outlook_mail

  logs:
    cmds:
      - docker compose -f infra/docker-compose.yml logs -f

  stop:
    cmds:
      - docker compose -f infra/docker-compose.yml down
