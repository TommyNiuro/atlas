# Stack completo en contenedores (api + worker ademas de los datos).
# Uso: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
services:
  api:
    build: ../apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ponytail: el worker de arq llega con el Bloque 2 (sync de conectores);
  # se define aqui para que el compose de prod ya tenga su lugar.
  # worker:
  #   build: ../apps/api
  #   command: ["uv", "run", "arq", "atlas.sync.WorkerSettings"]
