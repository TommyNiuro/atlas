<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%; overflow: hidden; background: #0a1020; color: #e8ecf4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
      }
      .wrap { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(120% 90% at 50% 20%, rgba(255,209,102,0.06), transparent 60%), #0a1020; }
      .logo { font-family: Georgia, serif; font-size: 64px; font-weight: 700; color: #ffd166; line-height: 1; }
      .logo .dot { color: #5b7bff; }
      #spinner { width: 26px; height: 26px; border: 3px solid rgba(148,163,210,0.2);
        border-top-color: #ffd166; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg { color: #8a99c2; font-size: 13px; max-width: 460px; text-align: center; padding: 0 24px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Atlas<span class="dot">.</span></div>
      <div id="spinner"></div>
      <div id="msg">Levantando tus servicios...</div>
    </div>
  </body>
</html>
