[package]
name = "atlas-desktop"
version = "0.5.0"
description = "Atlas (desktop)"
authors = ["Tomas Ffrench-Davis"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
